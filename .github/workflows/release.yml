name: Auto Build and Release

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "build.js"
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------- 版本生成和 Release Notes ----------
      - name: Generate Version and Release Notes
        id: release_info
        shell: bash
        run: |
          set -e

          # 获取最新 Tag
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)

          if [ -z "$LAST_TAG" ]; then
            LAST_TAG="v1.0.0"
          fi

          echo "Last Tag: $LAST_TAG"

          # 自动递增版本号
          VERSION_NUM=${LAST_TAG#v}
          MAJOR_MINOR=${VERSION_NUM%.*}
          PATCH=${VERSION_NUM##*.}

          NEW_PATCH=$((PATCH + 1))
          NEW_TAG="v${MAJOR_MINOR}.${NEW_PATCH}"

          echo "New Tag: $NEW_TAG"

          echo "NEW_TAG=$NEW_TAG" >> "$GITHUB_OUTPUT"

          # 获取 Commit 日志：排除 README.md / README_en.md 相关文件变更
          if git rev-parse "$LAST_TAG" >/dev/null 2>&1; then
            COMMITS=$(git log "$LAST_TAG"..HEAD --pretty=format:"- %s" -- . ':(exclude)README.md' ':(exclude)README_en.md')
          else
            COMMITS=$(git log --pretty=format:"- %s" -- . ':(exclude)README.md' ':(exclude)README_en.md')
          fi

          if [ -z "$COMMITS" ]; then
            COMMITS="- 自动更新配置与脚本"
          fi

          # 生成 Release 描述
          cat > release_body.txt <<EOF
          ### UI主题皮肤包含：\`modernz\`、\`modern_glass\` 和 \`uosc\` + 多种菜单风格

          - 如何自定义配置 mpv.conf 与快捷键/菜单 input.conf，在更新版本时直接覆盖不受影响？ 📢 [查看文档](https://mpvconfig.github.io/docs/custom.html)
          - 推荐： 油猴脚本 ⇢ [使用 mpv 播放网页中的视频](https://github.com/akFace/play-with-mpv)
          - 📔 [Docs Guide](https://mpvconfig.github.io/docs/en)  | 🛠 [详细使用教程](https://mpvconfig.github.io/docs/install.html) | 🚀 [更新教程](https://mpvconfig.github.io/docs/update.html) | 🍭 [超分滤镜说明指南](https://mpvconfig.github.io/docs/shaders.html) | ⌨ [常用快捷键](https://mpvconfig.github.io/docs/shortcuts.html) | 🎯 [主题效果预览](https://mpvconfig.github.io/docs/preview.html)

          > [!TIP]
          >
          > - 请选择喜欢的某一套下载，每一个压缩包都已包含所有配置文件，解压放到配置文件夹下，重启播放器即可
          > - Note: \`UIName_language.zip\` 前缀为UI主题名称，后缀为不同的语言，**中文版建议下载 `_zh.zip` 后缀版本**。 \`modern_glass\` 是模拟液态玻璃UI比较吃性能，建议在性能较好的设备上使用。
          > - 不想折腾教程的 ⇢ [懒人整合安装包解压直接用，所有功能一致](https://pan.quark.cn/s/44d4b871af74)

          ---

          ### Update log:

          EOF

          echo "$COMMITS" >> release_body.txt

      # ---------- 设置 Node.js 环境 ----------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ---------- 安装依赖 ----------
      - name: Install Dependencies
        run: npm install

      # ---------- 替换原有的 Create ZIP Archives 步骤 ----------
      - name: Build ZIP Archives with Node.js
        run: node build.js
        env:
          RELEASE_VERSION: ${{ steps.release_info.outputs.NEW_TAG }}

      # ---------- 创建 GitHub Release（文件路径改为 dist/*.zip） ----------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.NEW_TAG }}
          name: ${{ steps.release_info.outputs.NEW_TAG }}
          body_path: release_body.txt
          prerelease: false
          files: dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
